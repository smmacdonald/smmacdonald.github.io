name: Deploy Next.js Static Export to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # -------------------------
  # VERIFY
  # -------------------------
  verify:
    name: Verify Environment
    runs-on: ubuntu-latest

    steps:
      - name: Verify API Environment
        env:
          NEXT_PUBLIC_LOCAL_API_URL: ${{ secrets.NEXT_PUBLIC_LOCAL_API_URL }}
          NEXT_PUBLIC_LOCAL_API_GRAPHQL_URL: ${{ secrets.NEXT_PUBLIC_LOCAL_API_GRAPHQL_URL }}
        run: |
          set -e

          if [ -z "$NEXT_PUBLIC_LOCAL_API_URL" ]; then
            echo "::error::NEXT_PUBLIC_LOCAL_API_URL is not configured"
            exit 1
          fi

          if [ -z "$NEXT_PUBLIC_LOCAL_API_GRAPHQL_URL" ]; then
            echo "::error::NEXT_PUBLIC_LOCAL_API_GRAPHQL_URL is not configured"
            exit 1
          fi

          echo "NEXT_PUBLIC_LOCAL_API_URL is configured"
          echo "NEXT_PUBLIC_LOCAL_API_GRAPHQL_URL is configured"

  # -------------------------
  # BUILD
  # -------------------------
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site
        env:
          NEXT_PUBLIC_LOCAL_API_URL: ${{ secrets.NEXT_PUBLIC_LOCAL_API_URL }}
          NEXT_PUBLIC_LOCAL_API_GRAPHQL_URL: ${{ secrets.NEXT_PUBLIC_LOCAL_API_GRAPHQL_URL }}
        run: npm run build

      - name: Verify Static Export
        run: |
          set -e

          if [ ! -d "./out" ]; then
            echo "::error::Next.js static export directory ./out was not created"
            exit 1
          fi

          if [ ! -f "./out/index.html" ]; then
            echo "::error::./out/index.html was not created"
            exit 1
          fi

          echo "Static export created successfully"
          echo "Files generated: $(find ./out -type f | wc -l)"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # -------------------------
  # DEPLOY
  # -------------------------
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4